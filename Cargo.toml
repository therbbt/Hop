[workspace]
resolver = "2"
members = [
    "crates/hop-core",
    "crates/hop-shell",
    "crates/hop-ssh",
    "crates/hop-telnet",
    "crates/hop-serial",
    "crates/hop-rdp",
    "crates/hop-sftp",
    "app/hop",
]

[workspace.package]
version = "0.1.9"
edition = "2021"
license = "MIT"
repository = "https://github.com/hop-app/hop"

[workspace.dependencies]
hop-core = { path = "crates/hop-core" }
hop-shell = { path = "crates/hop-shell" }
hop-ssh = { path = "crates/hop-ssh" }
hop-telnet = { path = "crates/hop-telnet" }
hop-serial = { path = "crates/hop-serial" }
hop-rdp = { path = "crates/hop-rdp" }
hop-sftp = { path = "crates/hop-sftp" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "time", "process", "fs"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
bytes = "1"
directories = "5"
